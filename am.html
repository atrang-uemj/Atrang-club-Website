<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আগমনী ২০২৪ - Atrang Club, UEM Jaipur</title>
    <link rel="icon" href="image/loggo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
        }

        /* Loading Animation */
        #loading-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            opacity: 0;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #ff3366;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Particles */
        #particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: rgba(255, 51, 102, 0.5);
            border-radius: 50%;
        }

        /* Back Button */
        .back-button-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            background-color: #ff3366;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        .back-button:before {
            content: '←';
            margin-right: 8px;
            font-size: 18px;
        }

        .back-button:hover {
            background-color: #e01f4c;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 51, 102, 0.4);
        }

        .back-button:active {
            transform: translateY(-1px);
        }

        /* Hero Section */
        .activities-section {
            padding: 120px 0 60px;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('AM/image5.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .activities-section h1 {
            font-size: 60px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ff3366;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
            opacity: 0;
            transform: translateY(30px);
        }

        .subtitle {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 30px;
            max-width: 700px;
            margin: 0 auto;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(30px);
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            height: 0;
            padding-bottom: 100%; /* Makes it square */
        }

        .gallery-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.3s ease;
            filter: brightness(0.8);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: brightness(1);
        }

        .gallery-item:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
            pointer-events: none;
        }

        .gallery-item:hover:before {
            opacity: 1;
        }

        /* Enlarged Image View */
        .enlarged-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .enlarged-image img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }

        .enlarged-image .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ff3366;
            color: white;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .enlarged-image .close-button:hover {
            background-color: #e01f4c;
            transform: scale(1.1);
        }

        .nav-button {
            position: absolute;
            background-color: rgba(255, 51, 102, 0.7);
            color: white;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .prev-button {
            left: 20px;
        }

        .next-button {
            right: 20px;
        }

        .nav-button:hover {
            background-color: rgba(255, 51, 102, 1);
            transform: scale(1.1);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .activities-section h1 {
                font-size: 48px;
            }
            .subtitle {
                font-size: 20px;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .activities-section h1 {
                font-size: 36px;
            }
            .subtitle {
                font-size: 18px;
                padding: 0 20px;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .activities-section h1 {
                font-size: 28px;
            }
            .subtitle {
                font-size: 16px;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
                padding: 15px;
            }
            .nav-button {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Loading Animation -->
    <div id="loading-animation">
        <img src="image/loggo.png" alt="Atrang Logo" class="loading-logo" id="loading-logo">
        <div class="loading-spinner"></div>
    </div>

    <!-- Particles Background -->
    <div id="particles"></div>

    <!-- Back Button -->
    <div class="back-button-container">
        <a href="activites.html" class="back-button">Back to Activities</a>
    </div>

    <!-- Hero Section -->
    <section class="activities-section">
        <h1>আগমনী ২০২৪</h1>
        <p class="subtitle">An Event to Recall Maa Durga on Earth</p>
    </section>

    <!-- Gallery Section -->
    <div class="gallery">
        <div class="gallery-item">
            <img src="AM/image1.jpg" alt="Aagomoni 2024 - Image 1">
        </div>
        <div class="gallery-item">
            <img src="AM/image2.jpg" alt="Aagomoni 2024 - Image 2">
        </div>
        <div class="gallery-item">
            <img src="AM/image3.jpg" alt="Aagomoni 2024 - Image 3">
        </div>
        <div class="gallery-item">
            <img src="AM/image4.jpg" alt="Aagomoni 2024 - Image 4">
        </div>
        <div class="gallery-item">
            <img src="AM/image5.jpg" alt="Aagomoni 2024 - Image 5">
        </div>
        <div class="gallery-item">
            <img src="AM/image6.jpg" alt="Aagomoni 2024 - Image 6">
        </div>
        <div class="gallery-item">
            <img src="AM/image7.jpg" alt="Aagomoni 2024 - Image 7">
        </div>
        <div class="gallery-item">
            <img src="AM/image8.jpg" alt="Aagomoni 2024 - Image 8">
        </div>
        <div class="gallery-item">
            <img src="AM/image9.jpg" alt="Aagomoni 2024 - Image 9">
        </div>
    </div>

    <script>
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            // Loading Animation
            anime({
                targets: '#loading-logo',
                opacity: [0, 1],
                scale: [0.5, 1],
                duration: 1000,
                easing: 'easeInOutQuad'
            });

            // Hide loading animation after full page load
            window.addEventListener('load', function() {
                anime({
                    targets: '#loading-animation',
                    opacity: [1, 0],
                    duration: 800,
                    easing: 'easeInOutQuad',
                    complete: function() {
                        document.getElementById('loading-animation').style.display = 'none';
                        initPageAnimations();
                    }
                });
            });

            // Create particles
            const particlesContainer = document.getElementById('particles');
            const particlesCount = 50;
            
            for (let i = 0; i < particlesCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particlesContainer.appendChild(particle);
                
                const size = Math.random() * 5 + 2;
                const posX = Math.random() * window.innerWidth;
                const posY = Math.random() * window.innerHeight;
                const opacity = Math.random() * 0.5 + 0.1;
                
                anime({
                    targets: particle,
                    width: size,
                    height: size,
                    left: posX,
                    top: posY,
                    opacity: opacity,
                    backgroundColor: function() {
                        const colors = ['rgba(255, 51, 102, 0.5)', 'rgba(255, 255, 255, 0.3)', 'rgba(51, 153, 255, 0.5)'];
                        return colors[Math.floor(Math.random() * colors.length)];
                    },
                    duration: 0,
                    complete: function() {
                        animateParticle(particle);
                    }
                });
            }

            function animateParticle(particle) {
                anime({
                    targets: particle,
                    left: Math.random() * window.innerWidth,
                    top: Math.random() * window.innerHeight,
                    opacity: [
                        { value: Math.random() * 0.5 + 0.1, duration: 0 },
                        { value: 0, duration: 1000 }
                    ],
                    scale: [1, 0],
                    duration: function() { return Math.random() * 5000 + 3000; },
                    easing: 'easeOutExpo',
                    complete: function() {
                        // Reset position and start again
                        anime({
                            targets: particle,
                            left: Math.random() * window.innerWidth,
                            top: Math.random() * window.innerHeight,
                            opacity: Math.random() * 0.5 + 0.1,
                            scale: 1,
                            duration: 0,
                            complete: function() {
                                animateParticle(particle);
                            }
                        });
                    }
                });
            }

            // Initialize page animations
            function initPageAnimations() {
                // Hero section animations
                anime({
                    targets: '.activities-section h1',
                    opacity: [0, 1],
                    translateY: [30, 0],
                    duration: 1200,
                    easing: 'easeOutExpo'
                });

                anime({
                    targets: '.subtitle',
                    opacity: [0, 1],
                    translateY: [30, 0],
                    duration: 1200,
                    delay: 300,
                    easing: 'easeOutExpo'
                });

                // Gallery items animations
                anime({
                    targets: '.gallery-item',
                    opacity: [0, 1],
                    translateY: [30, 0],
                    duration: 800,
                    delay: function(el, i) {
                        return 500 + (i * 100);
                    },
                    easing: 'easeOutExpo'
                });
            }

            // Gallery functionality
            const galleryItems = document.querySelectorAll('.gallery-item');
            let currentImageIndex = 0;

            // Function to show enlarged image
            function showEnlargedImage(index) {
                currentImageIndex = index;
                
                // Get the image element
                const image = galleryItems[index].querySelector('img');
                
                // Create enlarged image container
                const enlargedImage = document.createElement('div');
                enlargedImage.classList.add('enlarged-image');
                
                // Create image element
                const imgElement = document.createElement('img');
                imgElement.src = image.src;
                enlargedImage.appendChild(imgElement);
                
                // Create close button
                const closeButton = document.createElement('button');
                closeButton.classList.add('close-button');
                closeButton.innerHTML = '×';
                closeButton.addEventListener('click', () => {
                    anime({
                        targets: enlargedImage,
                        opacity: [1, 0],
                        duration: 300,
                        easing: 'easeOutQuad',
                        complete: function() {
                            enlargedImage.remove();
                        }
                    });
                });
                enlargedImage.appendChild(closeButton);
                
                // Create navigation buttons
                const prevButton = document.createElement('button');
                prevButton.classList.add('nav-button', 'prev-button');
                prevButton.innerHTML = '←';
                prevButton.addEventListener('click', () => {
                    navigateImage(-1);
                });
                enlargedImage.appendChild(prevButton);
                
                const nextButton = document.createElement('button');
                nextButton.classList.add('nav-button', 'next-button');
                nextButton.innerHTML = '→';
                nextButton.addEventListener('click', () => {
                    navigateImage(1);
                });
                enlargedImage.appendChild(nextButton);
                
                // Add to document
                document.body.appendChild(enlargedImage);
                
                // Animate appearance
                anime({
                    targets: enlargedImage,
                    opacity: [0, 1],
                    duration: 300,
                    easing: 'easeOutQuad'
                });
                
                // Add keyboard navigation
                document.addEventListener('keydown', handleKeyDown);
            }
            
            // Function to navigate between images
            function navigateImage(direction) {
                currentImageIndex += direction;
                
                // Handle wraparound
                if (currentImageIndex < 0) {
                    currentImageIndex = galleryItems.length - 1;
                } else if (currentImageIndex >= galleryItems.length) {
                    currentImageIndex = 0;
                }
                
                // Remove current enlarged image
                const currentEnlarged = document.querySelector('.enlarged-image');
                anime({
                    targets: currentEnlarged,
                    opacity: [1, 0],
                    duration: 300,
                    easing: 'easeOutQuad',
                    complete: function() {
                        currentEnlarged.remove();
                        showEnlargedImage(currentImageIndex);
                    }
                });
            }
            
            // Handle keyboard navigation
            function handleKeyDown(event) {
                if (event.key === 'Escape') {
                    const enlargedImage = document.querySelector('.enlarged-image');
                    if (enlargedImage) {
                        anime({
                            targets: enlargedImage,
                            opacity: [1, 0],
                            duration: 300,
                            easing: 'easeOutQuad',
                            complete: function() {
                                enlargedImage.remove();
                            }
                        });
                    }
                    document.removeEventListener('keydown', handleKeyDown);
                } else if (event.key === 'ArrowLeft') {
                    navigateImage(-1);
                } else if (event.key === 'ArrowRight') {
                    navigateImage(1);
                }
            }
            
            // Add click event to gallery items
            galleryItems.forEach((item, index) => {
                item.addEventListener('click', () => {
                    showEnlargedImage(index);
                });
            });
        });
    </script>
</body>

</html>
