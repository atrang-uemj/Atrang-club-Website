<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural Fiesta - Atrang Club, UEM Jaipur</title>
    <link rel="icon" href="image/loggo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
        }

        /* Loading Animation */
        #loading-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            opacity: 0;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #ff3366;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Particles */
        #particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: rgba(255, 51, 102, 0.5);
            border-radius: 50%;
        }

        /* Back Button */
        .back-button-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            background-color: #ff3366;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        .back-button:before {
            content: '←';
            margin-right: 8px;
            font-size: 18px;
        }

        .back-button:hover {
            background-color: #e01f4c;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 51, 102, 0.4);
        }

        .back-button:active {
            transform: translateY(-1px);
        }

        /* Hero Section */
        .activities-section {
            padding: 120px 0 60px;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('CF/image1.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .activities-section h1 {
            font-size: 60px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ff3366;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
            opacity: 0;
            transform: translateY(30px);
        }

        .subtitle {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 30px;
            max-width: 700px;
            margin: 0 auto;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(30px);
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            height: 0;
            padding-bottom: 100%; /* Makes it square */
        }

        .gallery-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.3s ease;
            filter: brightness(0.8);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: brightness(1);
        }

        .gallery-item:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
            pointer-events: none;
        }

        .gallery-item:hover:before {
            opacity: 1;
        }

        /* Enlarged Image View */
        .enlarged-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .enlarged-image img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }

        .enlarged-image .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ff3366;
            color: white;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .enlarged-image .close-button:hover {
            background-color: #e01f4c;
            transform: scale(1.1);
        }

        .nav-button {
            position: absolute;
            background-color: rgba(255, 51, 102, 0.7);
            color: white;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .prev-button {
            left: 20px;
        }

        .next-button {
            right: 20px;
        }

        .nav-button:hover {
            background-color: rgba(255, 51, 102, 1);
            transform: scale(1.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff3366;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #e01f4c;
        }

        /* Image counter */
        .image-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                padding: 30px;
            }
        }

        @media (max-width: 768px) {
            .activities-section h1 {
                font-size: 40px;
            }

            .subtitle {
                font-size: 18px;
                padding: 0 20px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                padding: 20px;
            }

            .nav-button {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .activities-section h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 16px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                padding: 15px;
            }

            .back-button {
                padding: 8px 15px;
                font-size: 14px;
            }

            .enlarged-image .close-button {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }

            .nav-button {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <!-- Loading Animation -->
    <div id="loading-animation">
        <img src="image/loggo.png" alt="Atrang Club Logo" class="loading-logo">
        <div class="loading-spinner"></div>
    </div>

    <!-- Back Button -->
    <div class="back-button-container">
        <a href="index.html" class="back-button">Back to Home</a>
    </div>

    <!-- Particles Background -->
    <div id="particles"></div>

    <!-- Hero Section -->
    <section class="activities-section">
        <h1>Cultural Fiesta</h1>
        <p class="subtitle">A celebration of diversity, creativity, and cultural expression through various artistic performances and activities.</p>
    </section>

    <!-- Gallery -->
    <div class="gallery">
        <!-- Gallery items will be generated dynamically -->
    </div>

    <script>
        // Loading Animation
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                anime({
                    targets: '.loading-logo',
                    opacity: [0, 1],
                    scale: [0.5, 1],
                    duration: 1000,
                    easing: 'easeInOutQuad'
                });
                
                setTimeout(() => {
                    anime({
                        targets: '#loading-animation',
                        opacity: [1, 0],
                        duration: 1000,
                        easing: 'easeInOutQuad',
                        complete: function() {
                            document.getElementById('loading-animation').style.display = 'none';
                            animateContent();
                        }
                    });
                }, 1500);
            }, 500);
        });

        // Animate Content
        function animateContent() {
            anime({
                targets: '.activities-section h1',
                opacity: [0, 1],
                translateY: [30, 0],
                duration: 1000,
                easing: 'easeOutQuad'
            });

            anime({
                targets: '.subtitle',
                opacity: [0, 1],
                translateY: [30, 0],
                duration: 1000,
                delay: 300,
                easing: 'easeOutQuad'
            });

            setTimeout(() => {
                loadGallery();
            }, 600);
        }

        // Particles Background
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random position
                const posX = Math.random() * window.innerWidth;
                const posY = Math.random() * window.innerHeight;
                
                // Random size
                const size = Math.random() * 5 + 1;
                
                particle.style.left = `${posX}px`;
                particle.style.top = `${posY}px`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                
                particlesContainer.appendChild(particle);
                
                // Animation
                animateParticle(particle);
            }
        }

        function animateParticle(particle) {
            const duration = Math.random() * 10000 + 5000;
            const targetX = Math.random() * window.innerWidth;
            const targetY = Math.random() * window.innerHeight;
            
            anime({
                targets: particle,
                left: targetX,
                top: targetY,
                opacity: [
                    { value: Math.random() * 0.5 + 0.2, duration: duration / 2 },
                    { value: 0, duration: duration / 2 }
                ],
                easing: 'easeInOutQuad',
                duration: duration,
                complete: function() {
                    // Reposition and restart animation
                    particle.style.left = `${Math.random() * window.innerWidth}px`;
                    particle.style.top = `${Math.random() * window.innerHeight}px`;
                    particle.style.opacity = Math.random() * 0.5 + 0.2;
                    animateParticle(particle);
                }
            });
        }

        // Create particles
        createParticles();

        // Gallery
        const galleryImages = [
            'CF/image1.jpg',
            'CF/image2.jpg',
            'CF/image3.jpg',
            'CF/image4.jpg',
            'CF/image5.jpg',
            'CF/image6.jpg',
            'CF/image7.jpg',
            'CF/image8.jpg',
            'CF/image9.jpg',
            'CF/image10.jpg',
            'CF/image11.jpg',
            'CF/image12.jpg'
        ];

        function loadGallery() {
            const gallery = document.querySelector('.gallery');
            
            galleryImages.forEach((src, index) => {
                const item = document.createElement('div');
                item.classList.add('gallery-item');
                
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Cultural Fiesta Image ${index + 1}`;
                img.loading = 'lazy';
                
                item.appendChild(img);
                gallery.appendChild(item);
                
                // Click event to show enlarged image
                item.addEventListener('click', () => {
                    showEnlargedImage(index);
                });
                
                // Animate item on load
                setTimeout(() => {
                    anime({
                        targets: item,
                        opacity: [0, 1],
                        translateY: [30, 0],
                        duration: 1000,
                        easing: 'easeOutQuad'
                    });
                }, index * 100);
            });
        }

        // Enlarged Image View
        let currentImageIndex = 0;

        function showEnlargedImage(index) {
            currentImageIndex = index;
            
            const enlargedView = document.createElement('div');
            enlargedView.classList.add('enlarged-image');
            
            const img = document.createElement('img');
            img.src = galleryImages[index];
            img.alt = `Cultural Fiesta Image ${index + 1}`;
            
            const closeButton = document.createElement('button');
            closeButton.classList.add('close-button');
            closeButton.innerHTML = '×';
            closeButton.addEventListener('click', () => {
                document.body.removeChild(enlargedView);
            });
            
            const prevButton = document.createElement('button');
            prevButton.classList.add('nav-button', 'prev-button');
            prevButton.innerHTML = '❮';
            prevButton.addEventListener('click', (e) => {
                e.stopPropagation();
                changeImage(-1);
            });
            
            const nextButton = document.createElement('button');
            nextButton.classList.add('nav-button', 'next-button');
            nextButton.innerHTML = '❯';
            nextButton.addEventListener('click', (e) => {
                e.stopPropagation();
                changeImage(1);
            });
            
            const counter = document.createElement('div');
            counter.classList.add('image-counter');
            counter.textContent = `${index + 1}/${galleryImages.length}`;
            
            enlargedView.appendChild(img);
            enlargedView.appendChild(closeButton);
            enlargedView.appendChild(prevButton);
            enlargedView.appendChild(nextButton);
            enlargedView.appendChild(counter);
            
            document.body.appendChild(enlargedView);
            
            // Close on click outside image
            enlargedView.addEventListener('click', (e) => {
                if (e.target === enlargedView) {
                    document.body.removeChild(enlargedView);
                }
            });
            
            // Handle keyboard navigation
            document.addEventListener('keydown', handleKeyDown);
            
            function handleKeyDown(e) {
                if (e.key === 'Escape') {
                    document.body.removeChild(enlargedView);
                    document.removeEventListener('keydown', handleKeyDown);
                } else if (e.key === 'ArrowLeft') {
                    changeImage(-1);
                } else if (e.key === 'ArrowRight') {
                    changeImage(1);
                }
            }
            
            function changeImage(direction) {
                currentImageIndex = (currentImageIndex + direction + galleryImages.length) % galleryImages.length;
                img.src = galleryImages[currentImageIndex];
                counter.textContent = `${currentImageIndex + 1}/${galleryImages.length}`;
            }
        }
    </script>
</body>

</html>
